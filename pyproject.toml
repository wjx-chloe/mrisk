[project]
name = "mrisk"
version = "0.1.0"
description = "面向 A 股股票组合的市场风险管理系统：VaR/ES 计量、回测验证、压力测试、风险归因与限额监控，支持基于离线行情快照的可复现演示"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.96",
    "apscheduler>=3.11.3",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.65.0",
]

[project.scripts]
mrisk = "mrisk:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits akshare over the network (deselected by default)",
    "slow: needs the real database; skipped by the pre-commit hook",
]
addopts = "-m 'not network'"
